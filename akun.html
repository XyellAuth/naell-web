    </div>
    <a href="index.html" class="nav-auth-btn" style="text-decoration: none;">Kembali</a>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="window.toggleSidebar()"></div>
  <aside class="admin-sidebar" id="adminSidebar" style="z-index: 1000;">
    <div class="sidebar-brand"><span class="brand-icon">N</span><h2>Naell Store</h2></div>
    <p class="sidebar-label">MENU NAVIGASI</p>
    <ul class="sidebar-menu">      
      <li>
        <a href="index.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dasbor
        </a>
      </li>
      
      <li>
        <a href="order.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
          Buat Pesanan
        </a>
      </li>
      
      <li>
        <a href="riwayat.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"></path><circle cx="12" cy="12" r="10"></circle></svg>
          Riwayat Order
        </a>
      </li>
            
      <li>
        <a href="deposit.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="12" y1="10" x2="12" y2="16"></line><line x1="9" y1="13" x2="15" y2="13"></line></svg>
          Deposit
        </a>
      </li>
      
      <li>
        <a href="riwayat-deposit.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Riwayat Deposit
        </a>
      </li>

      <p class="sidebar-label" style="margin-top: 25px;">AKUN</p>
      
      <li>
        <a href="akun.html" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle><path d="M16 11l2 2 4-4"></path></svg>
          Pengaturan
        </a>
      </li>
      
      <li>
        <a href="riwayat-log.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          Riwayat Login
        </a>
      </li>
    </ul>
  </aside>

  <main class="container" style="margin-top: 30px;">
    <div class="admin-page-section" style="max-width: 700px; margin: 0 auto; padding: 30px;">
      
      <div class="settings-header">
        <h3 class="settings-title">Setting Akun</h3>
      </div>

      <div class="settings-group">
        <label>Email <span style="color: #ef4444;">*</span> <small style="color: #8292af; font-weight: normal;">(Hubungi Admin untuk mengubah email)</small></label>
        <input type="email" class="admin-input" id="setEmail" placeholder="email@example.com" readonly style="opacity: 0.7; cursor: not-allowed;">
      </div>

      <div class="settings-group">
        <label>Nama Pengguna</label>
        <input type="text" class="admin-input" id="setUsername" placeholder="Username" readonly style="opacity: 0.7; cursor: not-allowed;">
      </div>

      <div class="settings-group">
        <label>Nama Lengkap</label>
        <input type="text" class="admin-input" id="setFullName" placeholder="Nama Lengkap Anda">
      </div>

      <div class="settings-group">
        <label>Nomor WhatsApp</label>
        <input type="number" class="admin-input" id="setWhatsapp" placeholder="cth: 628123456789">
      </div>

      <hr style="border: none; border-top: 1px solid #2c3b57; margin: 30px 0;">

      <div class="settings-group">
        <label>Kata Sandi Baru</label>
        <div class="password-wrapper">
          <input type="password" class="admin-input" id="newPassword" placeholder="">
          <button type="button" class="toggle-password" onclick="window.togglePassword('newPassword', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <div class="settings-group">
        <label>Kata Sandi Saat Ini <span style="color: #ef4444;">*</span> <small style="color: #8292af; font-weight: normal;">(Wajib diisi jika ingin ubah password)</small></label>
        <div class="password-wrapper">
          <input type="password" class="admin-input" id="currentPassword" placeholder="">
          <button type="button" class="toggle-password" onclick="window.togglePassword('currentPassword', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button onclick="window.saveAccountSettings()" class="admin-btn-save" style="margin-top: 20px;">Simpan Perubahan</button>
    </div>
  </main>

  <script src="auth/auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
