<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <title>Catatan - Naell Store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div style="display: flex; align-items: center; gap: 15px;">
      <button class="menu-toggle" onclick="window.toggleSidebar()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <a href="index.html" class="brand"><span class="brand-icon">N</span></a>
    </div>
    <h2 style="color: white; font-size: 18px; font-weight: 800;">Catatan</h2>
    <a href="index.html" class="nav-auth-btn" style="text-decoration: none;">Kembali</a>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="window.toggleSidebar()"></div>
  
  <aside class="admin-sidebar" id="adminSidebar" style="z-index: 1000;">
    <div class="sidebar-brand"><span class="brand-icon">N</span><h2>Naell Store</h2></div>
    <p class="sidebar-label">MENU</p>
    <ul class="sidebar-menu">
      <li><a href="catatan.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>Catatan</a></li>
      <li><a href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>Dasbor</a></li>
      <li><a href="order.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>Buat Pesanan</a></li>
      <li><a href="riwayat.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"></path><circle cx="12" cy="12" r="10"></circle></svg>Riwayat Order</a></li>
      <li><a href="deposit.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="12" y1="10" x2="12" y2="16"></line><line x1="9" y1="13" x2="15" y2="13"></line></svg>Deposit</a></li>
      <li><a href="riwayat-deposit.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>Riwayat Deposit</a></li>
    </ul>
    <p class="sidebar-label">AKUN</p>
    <ul class="sidebar-menu">
      <li><a href="profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle><path d="M16 11l2 2 4-4"></path></svg>Pengaturan Profil</a></li>
      <li><a href="riwayat-log.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>Riwayat Login</a></li>
    </ul>
  </aside>

  <main class="container" style="margin-top: 30px; max-width: 800px;">
    
    <div id="mainContent" class="hide-catalog" style="width: 100%;">
      <div class="admin-page-section" style="padding: 30px; background: linear-gradient(145deg, #1b2944, #101a2d);">
        
        <h3 style="color: white; font-size: 18px; margin-bottom: 20px;">Tambah Catatan Baru</h3>
        <input type="text" id="note-title" class="admin-input" placeholder="Judul Catatan (misal: Jawaban Tugas Matematika)" style="margin-bottom: 10px;">
        <textarea id="note-content" class="admin-input" rows="5" placeholder="Tulis isi catatan Anda di sini..." style="margin-bottom: 10px;"></textarea>
        <label style="display: flex; align-items: center; gap: 8px; color: #c8d4eb; font-size: 13px; margin-bottom: 15px; cursor: pointer;">
          <input type="checkbox" id="note-is-public" style="width: 18px; height: 18px; accent-color: #80b5ff;">
          Catatan Publik
        </label>
        <button onclick="window.saveNote()" class="admin-btn-save" style="margin: 0;">Simpan Catatan</button>

        <h3 style="color: white; font-size: 18px; margin: 30px 0 20px 0; border-top: 1px solid #2c3b57; padding-top: 25px;">Daftar Catatan</h3>
        <div id="notesListContainer" style="display: flex; flex-direction: column; gap: 15px;">
          <p style="color: #8292af; text-align: center;">Memuat catatan...</p>
        </div>
      </div>
    </div>

    <div id="lockedContent" class="locked-minimal" style="display: none;">
      <div class="lock-container">
        <div class="lock-svg-wrapper">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#80b5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2 class="lock-title">Member Area</h2>
        <p class="lock-desc">Silakan masuk ke akun Anda untuk melanjutkan.</p>
        <button class="lock-btn" onclick="window.openAuthModal()">Masuk/Daftar</button>
      </div>
    </div>

  </main>

  <script src="auth/auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
