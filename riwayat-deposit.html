  <div class="sidebar-overlay" id="sidebarOverlay" onclick="window.toggleSidebar()"></div>
  
  <aside class="admin-sidebar" id="adminSidebar" style="z-index: 1000;">
    <div class="sidebar-brand"><span class="brand-icon">N</span><h2>Naell Store</h2></div>
    <p class="sidebar-label">MENU UTAMA</p>
    <ul class="sidebar-menu">
      <li><a href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>Dasbor</a></li>

      <li><a href="deposit.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="12" y1="10" x2="12" y2="16"></line><line x1="9" y1="13" x2="15" y2="13"></line></svg>Deposit</a></li>
      <li><a href="riwayat-deposit.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>Riwayat Deposit</a></li>
    </ul>

    <ul class="sidebar-menu">

  <main class="container" style="margin-top: 30px; max-width: 800px;">
    
    <div class="admin-page-section" style="padding: 25px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#80b5ff" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <h3 style="color: white; font-size: 18px; font-weight: 800; margin: 0;">Riwayat Deposit</h3>
        </div>
        <a href="deposit.html" class="admin-btn-save" style="width: auto; margin-bottom: 0; padding: 8px 16px; text-decoration: none; font-size: 12px;">+ Deposit Baru</a>
      </div>

      <div id="depositHistoryList" style="display: flex; flex-direction: column; gap: 15px;">
        <div style="text-align: center; color: #8292af; padding: 30px;">
          Memuat data riwayat...
        </div>
      </div>
    </div>

  </main>

  <script src="auth/auth.js"></script>
  <script src="script.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const listContainer = document.getElementById("depositHistoryList");
      const token = localStorage.getItem("naell_token");

      if (!token) {
        listContainer.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 30px;">Silakan login terlebih dahulu untuk melihat riwayat deposit.</div>';
        return;
      }

      try {
        const res = await fetch(`https://naell.web.id/api/users/deposit-history`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        
        const data = await res.json();
        listContainer.innerHTML = "";

        if (!data.deposits || data.deposits.length === 0) {
          listContainer.innerHTML = '<div style="text-align: center; color: #8292af; padding: 30px;">Belum ada riwayat deposit.</div>';
          return;
        }

        data.deposits.forEach(dep => {
          const dateObj = new Date(dep.created_at);
          const tgl = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
          
          let statusClass = "status-pending";
          let statusText = dep.status;
          if (dep.status === "Success") { statusClass = "status-success"; }
          if (dep.status === "Failed") { statusClass = "status-failed"; statusText = "Gagal"; }

          const div = document.createElement("div");
          div.className = "admin-product-item";
          div.style.background = "rgba(15, 26, 44, 0.6)";
          div.style.border = "1px solid #2c3b57";
          div.style.borderRadius = "12px";
          div.style.padding = "15px";
          
          div.innerHTML = `
            <div style="flex: 1;">
              <span class="admin-product-name" style="font-size: 15px; font-weight: 800; color: white;">Rp ${dep.amount.toLocaleString('id-ID')}</span>
              <div style="font-size: 11px; color: #8292af; margin-top: 5px;">
                ${tgl}
              </div>
            </div>
            <span class="status-badge ${statusClass}" style="padding: 6px 12px; font-size: 11px;">
              ${statusText}
            </span>
          `;
          listContainer.appendChild(div);
        });

      } catch (err) {
        listContainer.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 30px;">Gagal memuat data riwayat deposit.</div>';
      }
    });
  </script>
</body>
</html>
